packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@posthog/cli": true
  "@scarf/scarf": false
  core-js: false
  esbuild: true
  keytar: false
  puppeteer: false
  sharp: true

catalog:
  "@polar-sh/sdk": "^0.49.0"
  "@react-pdf/renderer": ^4.9.0
  "@types/node": ^26.6.5
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "better-auth": ^1.7.12
  "@better-auth/drizzle-adapter": ^1.7.12
  "drizzle-orm": ^0.45.4
  "drizzle-kit": ^0.31.11
  "lucide-react": ^1.61.0
  next: ^16.4.2
  "next-themes": "^0.4.6"
  postgres: "^3.4.9"
  react: ^19.3.1
  "react-dom": ^19.3.1
  "react-email": ^6.11.3
  resend: ^6.34.1
  stripe: "^23.0.0"
  typescript: "^7.0.2"
  vite: ^8.3.5
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  zod: ^4.6.7
  "@t3-oss/env-nextjs": "^0.13.11"

# drizzle-orm optionally peers @opentelemetry/api. Web and admin depend on
# that package for PostHog logs, which made pnpm install a second drizzle
# copy and broke admin's SQL types. One override keeps a single copy.
overrides:
  "drizzle-orm>@opentelemetry/api": "-"

minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.4.7'
  - '@scalar/hono-api-reference@0.12.8'
  - '@scalar/types@0.22.3'
  - hono@4.13.12
